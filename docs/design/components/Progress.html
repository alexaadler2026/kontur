<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Kontur · Progress</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><style>body{margin:0;padding:16px;background:var(--bg-page)}</style></head><body class="k-body">
<div style="display:flex;gap:48px;align-items:flex-start;flex-wrap:wrap"><div style="width:280px;display:flex;flex-direction:column;gap:16px"><div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="k-caption">Text erkennen</span><span class="k-caption k-num">68 %</span></div><div class="k-progress" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100"><span style="width:68%"></span></div></div><div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="k-caption">Abgeschlossen</span><span class="k-caption k-num">100 %</span></div><div class="k-progress k-progress--success"><span style="width:100%"></span></div></div><div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="k-caption" style="color:var(--error)">Fehlgeschlagen</span><span class="k-caption k-num">34 %</span></div><div class="k-progress k-progress--error"><span style="width:34%"></span></div></div></div><div style="display:flex;gap:24px;align-items:center"><span class="k-spinner" role="status" aria-label="Lädt"></span><svg class="k-ring" width="48" height="48" viewBox="0 0 48 48" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100"><circle class="k-ring-track" cx="24" cy="24" r="20"/><circle class="k-ring-bar" cx="24" cy="24" r="20" stroke-dasharray="125.6" stroke-dashoffset="40.2"/></svg></div></div>
</body></html>
