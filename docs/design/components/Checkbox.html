<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Kontur · Checkbox</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"></head><body class="k-body" style="margin:0;padding:16px;background:var(--bg-page)">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><span class="k-caption" style="width:96px;flex:none">Состояния</span><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><label class="k-check"><input type="checkbox">Kopie an mich senden</label><label class="k-check"><input type="checkbox" checked>AGB akzeptiert</label><label class="k-check"><input type="checkbox" id="ind">Teilweise gewählt</label><label class="k-check"><input type="checkbox" class="is-focus" checked>Fokus</label></div></div>
<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:16px"><span class="k-caption" style="width:96px;flex:none;padding-top:2px">Hint</span><div class="k-choice-item"><label class="k-check"><input type="checkbox" aria-describedby="cb-h">Erinnerungen per E-Mail</label><span class="k-hint" id="cb-h">Einmal täglich, wenn Dokumente auf Sie warten</span></div></div>
<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:16px"><span class="k-caption" style="width:96px;flex:none;padding-top:2px">Error (v3)</span><div class="k-choice-item"><label class="k-check is-invalid"><input type="checkbox" aria-invalid="true" aria-describedby="cb-e">Ich stimme den AGB zu</label><span class="k-error-msg" id="cb-e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="M10.3 3.8 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z"/><path d="M12 9v4m0 4h.01"/></svg> Bitte stimmen Sie den AGB zu, um fortzufahren</span></div></div>
<div style="display:flex;align-items:center;gap:12px"><span class="k-caption" style="width:96px;flex:none">Disabled</span><div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap"><label class="k-check is-disabled"><input type="checkbox" disabled>Nicht verfügbar</label><label class="k-check is-disabled"><input type="checkbox" disabled checked>Fixiert</label></div></div><script>document.getElementById("ind").indeterminate=true</script>
</body></html>
