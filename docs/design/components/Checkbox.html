<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Kontur · Checkbox</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><style>body{margin:0;padding:16px;background:var(--bg-page)}</style></head><body class="k-body">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span class="k-caption" style="width:96px;flex:none">Состояния</span><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><label class="k-check"><input type="checkbox">Kopie an mich senden</label><label class="k-check"><input type="checkbox" checked>AGB akzeptiert</label><label class="k-check"><input type="checkbox" id="ind">Teilweise gewählt</label></div></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span class="k-caption" style="width:96px;flex:none">Focus / Error</span><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><label class="k-check"><input type="checkbox" class="is-focus" checked>Fokus</label><label class="k-check" style="color:var(--error)"><input type="checkbox" style="border-color:var(--error)">Zustimmung erforderlich</label></div></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span class="k-caption" style="width:96px;flex:none">Disabled</span><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><label class="k-check is-disabled"><input type="checkbox" disabled>Nicht verfügbar</label><label class="k-check is-disabled"><input type="checkbox" disabled checked>Fixiert</label></div></div><script>document.getElementById("ind").indeterminate=true</script>
</body></html>
