<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Belegscan – Erkennung</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>
body{margin:0;background:#f7f8fa}
a{color:#0e5a6b}a:hover{color:#0b4855}
</style></head><body>
<div class="k-body" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden">

  <header style="flex: none; display: flex; align-items: center; justify-content: center; padding: 18px 16px">
    <span class="body-strong">Beleg wird erkannt</span>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 0 24px">
    <div style="position: relative; width: 120px; height: 120px">
      <svg class="k-ring" width="120" height="120" viewBox="0 0 120 120" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschritt der Erkennung">
        <circle class="k-ring-track" cx="60" cy="60" r="52" style="stroke-width: 6"/>
        <circle class="k-ring-bar" cx="60" cy="60" r="52" style="stroke-width: 6" stroke-dasharray="326.7" stroke-dashoffset="104.5"/>
      </svg>
      <span class="mono" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 500">68 %</span>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 280px">
      <li style="display: flex; align-items: center; gap: 12px">
        <span class="k-step-dot" style="background: var(--success); border-color: var(--success); color: var(--text-on-brand)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true"><path d="m4 12 5 5 11-11"/></svg></span>
        <span>Bild vorbereiten</span>
        <span class="mono-sm" style="margin-left: auto; color: var(--text-secondary)">0,4 s</span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px" aria-current="step">
        <span class="k-spinner" style="width: 24px; height: 24px; flex: none" role="status" aria-label="Läuft"></span>
        <span class="body-strong">Text erkennen</span>
        <span class="mono-sm" style="margin-left: auto; color: var(--brand)">68 %</span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; color: var(--text-secondary)">
        <span class="k-step-dot">3</span>
        <span>Daten zuordnen</span>
      </li>
    </ol>
  </main>

  <footer style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 24px 40px">
    <span class="k-badge k-badge--success" style="height: 26px; padding: 0 12px 0 9px">
      Lokal auf dem Gerät
    </span>
    <span class="k-caption" style="text-align: center; max-width: 280px">Die Erkennung läuft im Browser (ONNX). Keine Daten verlassen das Gerät — DSGVO-freundlich.</span>
    <button class="k-btn k-btn--ghost k-btn--touch" style="margin-top: 4px">Abbrechen</button>
  </footer>
</div>
</body></html>
