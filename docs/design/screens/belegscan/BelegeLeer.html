<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Belegscan – leere Belegliste</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>
body{margin:0;background:#f7f8fa}
a{color:#0e5a6b}a:hover{color:#0b4855}
</style></head><body>
<div class="k-body" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden">

  <header style="flex: none; padding: 16px 16px 8px">
    <h1 class="h2" style="margin: 0">Belege</h1>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 32px">
    <div style="position: relative; width: 140px; height: 180px">
      <div style="position: absolute; inset: 0; border: 1.5px dashed var(--border-input); border-radius: var(--radius-md); background: var(--bg-surface)"></div>
      <div style="position: absolute; left: 24px; top: 22px; width: 92px; height: 120px; background: var(--bg-subtle); border-radius: 3px; padding: 12px 10px; box-sizing: border-box">
        <div style="height: 5px; width: 70%; margin: 0 auto 8px; background: var(--border-subtle); border-radius: 2px"></div>
        <div style="height: 4px; background: var(--border-subtle); border-radius: 2px; margin-bottom: 6px"></div>
        <div style="height: 4px; width: 80%; background: var(--border-subtle); border-radius: 2px; margin-bottom: 6px"></div>
        <div style="height: 4px; width: 60%; background: var(--border-subtle); border-radius: 2px"></div>
      </div>
      <span style="position: absolute; right: -10px; bottom: -10px; width: 44px; height: 44px; border-radius: var(--radius-full); background: var(--brand); color: var(--text-on-brand); display: inline-flex; align-items: center; justify-content: center; border: 3px solid var(--bg-page)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </span>
    </div>
    <div style="text-align: center; display: flex; flex-direction: column; gap: 8px; max-width: 280px">
      <span class="h3" style="font-size: 18px; line-height: 26px">Noch keine Belege</span>
      <span class="k-caption">Fotografieren Sie Ihren ersten Kassenbon — die Erkennung läuft direkt auf dem Gerät und dauert wenige Sekunden.</span>
    </div>
    <button class="k-btn k-btn--primary k-btn--touch" style="width: 100%; max-width: 280px">
      <svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>Ersten Beleg scannen
    </button>
    <button class="k-btn k-btn--ghost k-btn--touch" style="width: 100%; max-width: 280px">Aus Galerie importieren</button>
  </main>

  <nav style="flex: none; display: flex; padding: 8px 8px 24px; background: var(--bg-surface); border-top: 1px solid var(--border-subtle)" aria-label="Hauptnavigation">
    <a href="#" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--brand); font: 500 11px/14px var(--font-sans)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Belege
    </a>
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--text-secondary); font: 400 11px/14px var(--font-sans)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>Scannen
    </a>
    <a href="Dashboard.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; text-decoration: none; color: var(--text-secondary); font: 400 11px/14px var(--font-sans)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>Auswertung
    </a>
  </nav>
</div>
</body></html>
