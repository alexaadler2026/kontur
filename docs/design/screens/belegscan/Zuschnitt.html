<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Belegscan – Zuschnitt</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>
body{margin:0;background:#101418}
a{color:#4fb3c4}a:hover{color:#6fc2d0}
</style></head><body>
<div class="k-body" data-theme="dark" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #101418; color: var(--text-primary); font-family: var(--font-sans); overflow: hidden">

  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px">
    <button class="k-icon-btn" style="width: 44px; height: 44px; color: #e6e9ed" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true"><path d="M19 12H5m0 0 6 6m-6-6 6-6"/></svg></button>
    <span class="body-strong" style="color: #e6e9ed">Zuschneiden &amp; ausrichten</span>
    <button class="k-btn k-btn--ghost k-btn--sm" style="color: #4fb3c4">Zurücksetzen</button>
  </header>

  <main style="flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center">
    <div style="position: relative; width: 300px; height: 500px">
      <div style="position: absolute; inset: 0; background: #2a2f36; border-radius: 4px"></div>
      <div style="position: absolute; left: 24px; top: 30px; right: 30px; bottom: 36px; background: #f3f0e9; border-radius: 2px; transform: perspective(600px) rotateZ(-2deg); padding: 18px 14px; box-sizing: border-box">
        <div style="height: 7px; width: 68%; margin: 0 auto 10px; background: #c9c4b8; border-radius: 2px"></div>
        <div style="height: 4px; background: #d9d4c8; border-radius: 2px; margin-bottom: 6px"></div>
        <div style="height: 4px; background: #d9d4c8; border-radius: 2px; margin-bottom: 6px"></div>
        <div style="height: 4px; width: 82%; background: #d9d4c8; border-radius: 2px; margin-bottom: 14px"></div>
        <div style="height: 5px; width: 55%; background: #c9c4b8; border-radius: 2px; margin-bottom: 14px"></div>
        <div style="height: 4px; width: 72%; background: #d9d4c8; border-radius: 2px; margin-bottom: 6px"></div>
        <div style="height: 4px; width: 60%; background: #d9d4c8; border-radius: 2px"></div>
      </div>
      <svg viewBox="0 0 300 500" width="300" height="500" style="position: absolute; inset: 0" role="img" aria-label="Zuschnittrahmen mit vier Griffen">
        <path d="M26 32 L272 26 L268 466 L22 460 Z" fill="rgba(79, 179, 196, 0.08)" stroke="#4fb3c4" stroke-width="2" stroke-dasharray="7 5"/>
        <line x1="26" y1="176" x2="270" y2="172" stroke="rgba(79, 179, 196, 0.35)" stroke-width="1"/>
        <line x1="25" y1="320" x2="269" y2="318" stroke="rgba(79, 179, 196, 0.35)" stroke-width="1"/>
        <line x1="108" y1="30" x2="104" y2="462" stroke="rgba(79, 179, 196, 0.35)" stroke-width="1"/>
        <line x1="190" y1="28" x2="186" y2="464" stroke="rgba(79, 179, 196, 0.35)" stroke-width="1"/>
        <circle cx="26" cy="32" r="13" fill="#101418" stroke="#4fb3c4" stroke-width="3"/>
        <circle cx="272" cy="26" r="13" fill="#101418" stroke="#4fb3c4" stroke-width="3"/>
        <circle cx="268" cy="466" r="13" fill="#101418" stroke="#4fb3c4" stroke-width="3"/>
        <circle cx="22" cy="460" r="13" fill="#101418" stroke="#4fb3c4" stroke-width="3"/>
      </svg>
      <span style="position: absolute; left: 50%; bottom: -8px; translate: -50% 100%; white-space: nowrap" class="k-caption">Ecken an den Belegrand ziehen</span>
    </div>
  </main>

  <div style="flex: none; display: flex; justify-content: center; gap: 8px; padding: 8px 16px">
    <span class="k-badge k-badge--info">Perspektive wird automatisch begradigt</span>
  </div>

  <footer style="flex: none; display: flex; gap: 12px; padding: 16px 16px 32px">
    <button class="k-btn k-btn--secondary k-btn--touch" style="flex: 1">Zurück</button>
    <button class="k-btn k-btn--primary k-btn--touch" style="flex: 2">Weiter<svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M5 12h14m0 0-5-5m5 5-5 5"/></svg></button>
  </footer>
</div>
</body></html>
