<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Dokumente – Ladezustand</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>
body{margin:0;background:#f7f8fa}
a{color:#0e5a6b}a:hover{color:#0b4855}
</style></head><body>
<div class="k-body" style="width: 1440px; height: 620px; box-sizing: border-box; padding: 32px 48px; display: flex; flex-direction: column; gap: 16px; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden">
  <h1 class="h1" style="margin: 0">Dokumente</h1>
  <div class="k-tabs" role="tablist">
    <button class="k-tab" role="tab" aria-selected="true">Eingang</button>
    <button class="k-tab" role="tab" aria-selected="false">Gesendet</button>
    <button class="k-tab" role="tab" aria-selected="false">Entwürfe</button>
    <button class="k-tab" role="tab" aria-selected="false">Archiv</button>
  </div>
  <div class="k-table-wrap" style="flex: 1; min-height: 0; display: flex; flex-direction: column" aria-busy="true">
    <div class="k-table-toolbar">
      <span class="k-skeleton" style="width: 280px; height: 32px; border-radius: var(--radius-sm)"></span>
      <span class="k-skeleton" style="width: 110px; height: 32px; border-radius: var(--radius-sm)"></span>
      <span class="k-skeleton" style="width: 150px; height: 32px; border-radius: var(--radius-sm)"></span>
    </div>
    <table class="k-table" style="flex: 1">
      <thead><tr>
        <th style="width: 44px"></th>
        <th style="width: 340px">Dokument</th><th>Vertragspartner</th>
        <th style="width: 130px">Status</th><th style="width: 170px">Unterzeichnende</th>
        <th class="k-num" style="width: 110px">Frist</th><th style="width: 120px">Geändert</th>
      </tr></thead>
      <tbody>
        <tr><td><span class="k-skeleton" style="width: 16px; height: 16px"></span></td><td><span class="k-skeleton" style="width: 78%"></span></td><td><span class="k-skeleton" style="width: 60%"></span></td><td><span class="k-skeleton" style="width: 72px; height: 20px; border-radius: var(--radius-full)"></span></td><td><span class="k-skeleton" style="width: 90px"></span></td><td><span class="k-skeleton" style="width: 72px; margin-left: auto"></span></td><td><span class="k-skeleton" style="width: 56px"></span></td></tr>
        <tr><td><span class="k-skeleton" style="width: 16px; height: 16px"></span></td><td><span class="k-skeleton" style="width: 62%"></span></td><td><span class="k-skeleton" style="width: 70%"></span></td><td><span class="k-skeleton" style="width: 72px; height: 20px; border-radius: var(--radius-full)"></span></td><td><span class="k-skeleton" style="width: 70px"></span></td><td><span class="k-skeleton" style="width: 72px; margin-left: auto"></span></td><td><span class="k-skeleton" style="width: 48px"></span></td></tr>
        <tr><td><span class="k-skeleton" style="width: 16px; height: 16px"></span></td><td><span class="k-skeleton" style="width: 84%"></span></td><td><span class="k-skeleton" style="width: 52%"></span></td><td><span class="k-skeleton" style="width: 72px; height: 20px; border-radius: var(--radius-full)"></span></td><td><span class="k-skeleton" style="width: 100px"></span></td><td><span class="k-skeleton" style="width: 72px; margin-left: auto"></span></td><td><span class="k-skeleton" style="width: 60px"></span></td></tr>
        <tr><td><span class="k-skeleton" style="width: 16px; height: 16px"></span></td><td><span class="k-skeleton" style="width: 70%"></span></td><td><span class="k-skeleton" style="width: 64%"></span></td><td><span class="k-skeleton" style="width: 72px; height: 20px; border-radius: var(--radius-full)"></span></td><td><span class="k-skeleton" style="width: 82px"></span></td><td><span class="k-skeleton" style="width: 72px; margin-left: auto"></span></td><td><span class="k-skeleton" style="width: 52px"></span></td></tr>
        <tr><td><span class="k-skeleton" style="width: 16px; height: 16px"></span></td><td><span class="k-skeleton" style="width: 58%"></span></td><td><span class="k-skeleton" style="width: 72%"></span></td><td><span class="k-skeleton" style="width: 72px; height: 20px; border-radius: var(--radius-full)"></span></td><td><span class="k-skeleton" style="width: 64px"></span></td><td><span class="k-skeleton" style="width: 72px; margin-left: auto"></span></td><td><span class="k-skeleton" style="width: 56px"></span></td></tr>
      </tbody>
    </table>
    <div class="k-pagination"><span class="k-caption" style="display: inline-flex; align-items: center; gap: 8px"><span class="k-spinner" style="width: 14px; height: 14px; border-width: 2px" role="status" aria-label="Lädt"></span>Dokumente werden geladen…</span></div>
  </div>
</div>
</body></html>
