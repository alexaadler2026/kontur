<!doctype html><html lang="de"><head><meta charset="utf-8"><title>SignFlow – Signieren (mobil)</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>
body{margin:0;background:#f7f8fa}
a{color:#0e5a6b}a:hover{color:#0b4855}
</style></head><body>
<div class="k-body" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg-subtle); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden">

  <header style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle)">
    <button class="k-icon-btn" style="width: 36px; height: 36px; margin-left: -8px" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M19 12H5m0 0 6 6m-6-6 6-6"/></svg></button>
    <span style="min-width: 0; flex: 1">
      <span class="body-strong" style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rahmenvertrag IT-Dienstleistungen 2027</span>
      <span class="k-caption">Muster Logistik GmbH · Frist <span class="mono-sm">20.11.2026</span></span>
    </span>
    <button class="k-icon-btn" style="width: 36px; height: 36px" aria-label="Weitere Aktionen"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <div style="position: relative; width: 358px; height: 506px; flex: none; background: #ffffff; border: 1px solid var(--border-subtle); border-radius: 2px; box-shadow: var(--shadow-overlay-sm); padding: 28px 24px; box-sizing: border-box" aria-label="Seite 2 des Dokuments">
      <div style="height: 8px; width: 55%; background: #dde1e6; border-radius: 2px; margin-bottom: 14px"></div>
      <div style="height: 5px; background: #f0f2f5; border-radius: 2px; margin-bottom: 6px"></div>
      <div style="height: 5px; background: #f0f2f5; border-radius: 2px; margin-bottom: 6px"></div>
      <div style="height: 5px; width: 90%; background: #f0f2f5; border-radius: 2px; margin-bottom: 6px"></div>
      <div style="height: 5px; width: 66%; background: #f0f2f5; border-radius: 2px; margin-bottom: 16px"></div>
      <div style="height: 5px; background: #f0f2f5; border-radius: 2px; margin-bottom: 6px"></div>
      <div style="height: 5px; width: 82%; background: #f0f2f5; border-radius: 2px"></div>

      <span class="k-caption" style="position: absolute; left: 24px; bottom: 170px; color: #5b6470">Für Muster Logistik GmbH:</span>
      <div style="position: absolute; left: 24px; bottom: 112px; width: 160px; height: 50px; border: 1.5px solid var(--success); background: var(--success-subtle); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 160 40" width="120" height="30" role="img" aria-label="Geleistete Unterschrift"><path d="M8 30 C 24 6, 34 8, 40 24 C 46 38, 56 36, 66 18 C 72 8, 78 10, 82 22 C 86 32, 96 34, 110 20 L 150 14" fill="none" stroke="#161b22" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="is-focus" style="position: absolute; left: 24px; bottom: 54px; width: 130px; height: 44px; border: 1.5px dashed var(--brand); background: var(--brand-subtle); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; outline: var(--focus-width) solid var(--focus-ring); outline-offset: 2px">
        <span class="k-label" style="color: var(--brand); text-transform: uppercase">Datum · Sie</span>
      </div>
      <div style="position: absolute; right: 24px; bottom: 54px; width: 150px; height: 44px; border: 1.5px dashed var(--border-input); background: var(--bg-subtle); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center">
        <span class="k-caption" style="text-align: center">Unterschrift<br>J. Becker</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <button class="k-icon-btn" style="width: 32px; height: 32px" aria-label="Vorherige Seite">‹</button>
      <span class="k-caption">Seite <b class="mono-sm" style="color: var(--text-primary)">2 / 4</b></span>
      <button class="k-icon-btn" style="width: 32px; height: 32px" aria-label="Nächste Seite">›</button>
    </div>
  </main>

  <footer style="flex: none; padding: 16px 16px 28px; background: var(--bg-surface); border-top: 1px solid var(--border-subtle); box-shadow: var(--shadow-overlay-sm); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span class="k-caption">Feld <b class="mono-sm" style="color: var(--text-primary)">2 von 3</b> ausgefüllt</span>
      <span class="k-badge k-badge--info">Als Nächstes: Datum</span>
    </div>
    <div class="k-progress" role="progressbar" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschritt"><span style="width: 66%"></span></div>
    <button class="k-btn k-btn--primary k-btn--touch" style="width: 100%"><svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>Feld ausfüllen</button>
    <button class="k-btn k-btn--ghost k-btn--touch" style="width: 100%">Später fortsetzen</button>
  </footer>
</div>
</body></html>
