<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Dokumente – Ladefehler</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>
body{margin:0;background:#f7f8fa}
a{color:#0e5a6b}a:hover{color:#0b4855}
</style></head><body>
<div class="k-body" style="width: 1440px; height: 620px; box-sizing: border-box; padding: 32px 48px; display: flex; flex-direction: column; gap: 16px; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden">
  <h1 class="h1" style="margin: 0">Dokumente</h1>
  <div class="k-tabs" role="tablist">
    <button class="k-tab" role="tab" aria-selected="true">Eingang</button>
    <button class="k-tab" role="tab" aria-selected="false">Gesendet</button>
    <button class="k-tab" role="tab" aria-selected="false">Entwürfe</button>
    <button class="k-tab" role="tab" aria-selected="false">Archiv</button>
  </div>
  <div class="k-table-wrap" style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center">
    <div class="k-empty" role="alert" style="max-width: 440px">
      <svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="40" height="40" aria-hidden="true"><path d="M10.3 3.8 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z"/><path d="M12 9v4m0 4h.01"/></svg>
      <span class="h3" style="font-size: 16px; line-height: 24px; color: var(--text-primary)">Dokumente konnten nicht geladen werden</span>
      <span class="k-caption">Der Server hat nicht geantwortet (Fehler <code class="mono-sm">503</code>). Ihre Dokumente sind davon nicht betroffen. Bitte prüfen Sie die Verbindung und versuchen Sie es erneut.</span>
      <div style="display: flex; gap: 8px; margin-top: 8px">
        <button class="k-btn k-btn--primary">Erneut versuchen</button>
        <button class="k-btn k-btn--ghost">Status der Dienste</button>
      </div>
    </div>
  </div>
</div>
</body></html>
