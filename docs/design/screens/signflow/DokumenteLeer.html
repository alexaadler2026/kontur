<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Dokumente – leerer Zustand</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>
body{margin:0;background:#f7f8fa}
a{color:#0e5a6b}a:hover{color:#0b4855}
</style></head><body>
<div class="k-body" style="width: 1440px; height: 620px; box-sizing: border-box; padding: 32px 48px; display: flex; flex-direction: column; gap: 16px; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden">
  <h1 class="h1" style="margin: 0">Dokumente</h1>
  <div class="k-tabs" role="tablist">
    <button class="k-tab" role="tab" aria-selected="true">Eingang <span class="k-count mono-sm">0</span></button>
    <button class="k-tab" role="tab" aria-selected="false">Gesendet <span class="k-count mono-sm">0</span></button>
    <button class="k-tab" role="tab" aria-selected="false">Entwürfe <span class="k-count mono-sm">0</span></button>
    <button class="k-tab" role="tab" aria-selected="false">Archiv</button>
  </div>
  <div class="k-table-wrap" style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center">
    <div class="k-empty" style="max-width: 420px">
      <svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="40" height="40" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>
      <span class="h3" style="font-size: 16px; line-height: 24px; color: var(--text-primary)">Noch keine Dokumente</span>
      <span class="k-caption">Laden Sie ein PDF hoch und legen Sie fest, wer unterschreiben soll. Der erste Umlauf dauert etwa zwei Minuten.</span>
      <div style="display: flex; gap: 8px; margin-top: 8px">
        <button class="k-btn k-btn--primary"><svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M12 17V4m0 0 5 5m-5-5-5 5M4 20h16"/></svg>Dokument hochladen</button>
        <button class="k-btn k-btn--secondary">Vorlage ansehen</button>
      </div>
    </div>
  </div>
</div>
</body></html>
