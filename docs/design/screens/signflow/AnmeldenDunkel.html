<!doctype html><html lang="de"><head><meta charset="utf-8"><title>SignFlow – Anmelden (dunkel, Formularfehler)</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>

<div class="k-body" data-theme="dark" style="width:1440px;height:900px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans);overflow:hidden"><header style="display:flex;justify-content:flex-end;padding:20px 32px"><div class="k-field-wrap" style="width:140px"><select class="k-select k-select--sm" aria-label="Sprache"><option selected>Deutsch</option><option>English</option><option>Русский</option></select><svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div></header><main style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding-bottom:40px"><div style="display:flex;align-items:center;gap:12px"><svg viewBox="0 0 48 48" width="36" height="36" aria-hidden="true">  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0E5A6B"/>
  <path d="M10 31 C 15 20, 20 20, 22 27 C 24 34, 28 34, 31 25 L 33 21" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 37 H 36" stroke="#8ED0DB" stroke-width="3" stroke-linecap="round"/>
</svg><span class="h3" style="font-size:20px">SignFlow</span></div><div style="width:400px;box-sizing:border-box;padding:32px;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:24px"><div><h1 id="t" class="h2" style="margin:0">Anmelden</h1><p class="k-caption" style="margin:4px 0 0">Melden Sie sich mit Ihrem SignFlow-Konto an.</p></div><form novalidate style="display:flex;flex-direction:column;gap:16px" aria-labelledby="t"><div class="k-form-item" style="max-width:none"><label for="email">E-Mail-Adresse</label><input id="email" class="k-field" type="email" autocomplete="username" required value="anna.berger@muster-logistik.de"></div><div style="display:flex;flex-direction:column;gap:8px"><div class="k-form-item" style="max-width:none"><label for="pw">Passwort</label><input id="pw" class="k-field" type="password" autocomplete="current-password" required value="••••••••••"></div><a class="k-link k-caption" style="align-self:flex-start;color:var(--brand)" href="#">Passwort vergessen?</a></div><div class="k-alert k-alert--error" role="alert"><svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><div class="k-alert-body"><span>E-Mail-Adresse oder Passwort ist falsch.</span></div></div><button class="k-btn k-btn--primary" type="submit" style="width:100%;margin-top:4px">Anmelden</button></form></div><p class="k-caption" style="margin:0;text-align:center">Konten werden nur per Einladung vergeben.</p></main><footer style="padding:20px 32px 28px"><nav aria-label="Rechtliches" class="k-caption" style="display:flex;gap:16px;justify-content:center"><a class="k-link" href="#" style="color:var(--text-secondary)">Datenschutz</a><a class="k-link" href="#" style="color:var(--text-secondary)">Impressum</a></nav></footer></div>
</body></html>
