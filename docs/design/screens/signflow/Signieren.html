<!doctype html><html lang="de"><head><meta charset="utf-8"><title>SignFlow – Signieren</title><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"><style>
body{margin:0;background:#f7f8fa}
a{color:#0e5a6b}a:hover{color:#0b4855}
</style></head><body>
<div class="k-body" style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; background: var(--bg-page); color: var(--text-primary); font-family: var(--font-sans); overflow: hidden">

  <header style="height: 60px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle)">
    <svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="10" fill="var(--brand)"/><path d="M10 31 C 15 20, 20 20, 22 27 C 24 34, 28 34, 31 25 L 33 21" fill="none" stroke="var(--text-on-brand)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="min-width: 0"><span class="body-strong" style="display: block">Rahmenvertrag IT-Dienstleistungen 2027</span><span class="k-caption">Von Max Beispiel · Frist <span class="mono-sm">20.11.2026</span></span></span>
    <span style="flex: 1"></span>
    <span class="k-caption">Feld <b class="mono-sm" style="color: var(--text-primary)">2 von 3</b></span>
    <span class="k-progress" style="width: 140px" role="progressbar" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschritt"><span style="width: 33%"></span></span>
    <button class="k-btn k-btn--secondary k-btn--sm">Ablehnen…</button>
    <button class="k-btn k-btn--ghost k-btn--sm">Abbrechen</button>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; padding: 24px; overflow: hidden">
    <div style="position: relative; width: 560px; height: 792px; background: #ffffff; border: 1px solid var(--border-subtle); border-radius: 2px; box-shadow: var(--shadow-overlay-sm); padding: 48px 44px; box-sizing: border-box" aria-label="Seite 2 des Dokuments">
      <div style="height: 10px; width: 55%; background: #dde1e6; border-radius: 2px; margin-bottom: 20px"></div>
      <div style="height: 6px; background: #f0f2f5; border-radius: 2px; margin-bottom: 8px"></div>
      <div style="height: 6px; background: #f0f2f5; border-radius: 2px; margin-bottom: 8px"></div>
      <div style="height: 6px; width: 92%; background: #f0f2f5; border-radius: 2px; margin-bottom: 8px"></div>
      <div style="height: 6px; width: 70%; background: #f0f2f5; border-radius: 2px; margin-bottom: 24px"></div>
      <div style="height: 6px; background: #f0f2f5; border-radius: 2px; margin-bottom: 8px"></div>
      <div style="height: 6px; width: 85%; background: #f0f2f5; border-radius: 2px"></div>

      <span class="k-caption" style="position: absolute; left: 44px; bottom: 268px; color: #5b6470">Für Muster Logistik GmbH:</span>
      <div style="position: absolute; left: 44px; bottom: 196px; width: 210px; height: 64px; border: 1.5px solid var(--success); background: var(--success-subtle); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 160 40" width="150" height="38" role="img" aria-label="Geleistete Unterschrift">
          <path d="M8 30 C 24 6, 34 8, 40 24 C 46 38, 56 36, 66 18 C 72 8, 78 10, 82 22 C 86 32, 96 34, 110 20 L 150 14" fill="none" stroke="#161b22" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span style="position: absolute; top: -9px; right: -9px; width: 18px; height: 18px; border-radius: var(--radius-full); background: var(--success); color: var(--text-on-brand); display: inline-flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="11" height="11" aria-hidden="true"><path d="m4 12 5 5 11-11"/></svg></span>
      </div>
      <div class="is-focus" style="position: absolute; left: 44px; bottom: 140px; width: 150px; height: 40px; border: 1.5px dashed var(--brand); background: var(--brand-subtle); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; outline: var(--focus-width) solid var(--focus-ring); outline-offset: 2px">
        <span class="k-label" style="color: var(--brand); text-transform: uppercase">Datum · Ihr Feld</span>
      </div>
      <div style="position: absolute; right: 44px; bottom: 196px; width: 210px; height: 64px; border: 1.5px dashed var(--border-input); background: var(--bg-subtle); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center">
        <span class="k-caption">Unterschrift · Jonas Becker</span>
      </div>
    </div>
  </main>

  <div style="position: absolute; right: 24px; bottom: 24px; display: flex; gap: 8px">
    <button class="k-btn k-btn--secondary">Voriges Feld</button>
    <button class="k-btn k-btn--primary">Nächstes Feld<svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M5 12h14m0 0-5-5m5 5-5 5"/></svg></button>
  </div>

  <div style="position: absolute; inset: 0; background: var(--overlay-scrim)" aria-hidden="true"></div>
  <div class="k-dialog" role="dialog" aria-modal="true" aria-labelledby="sig-t" style="position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 520px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <h2 id="sig-t">Ihre Unterschrift</h2>
      <button class="k-icon-btn" style="width: 28px; height: 28px; margin: -4px -8px 0 0" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="k-tabs" role="tablist" aria-label="Art der Unterschrift" style="margin-top: 4px">
      <button class="k-tab" role="tab" aria-selected="true">Zeichnen</button>
      <button class="k-tab" role="tab" aria-selected="false">Tippen</button>
      <button class="k-tab" role="tab" aria-selected="false">Hochladen</button>
    </div>
    <div style="margin-top: 16px; height: 150px; border: 1.5px dashed var(--border-input); border-radius: var(--radius-md); background: var(--bg-surface); position: relative; display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 320 90" width="320" height="90" role="img" aria-label="Gezeichnete Unterschrift">
        <path d="M16 66 C 46 14, 66 18, 78 50 C 90 80, 110 76, 130 38 C 142 16, 154 20, 162 44 C 170 64, 190 68, 218 42 C 236 26, 262 30, 300 34" fill="none" stroke="#161b22" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span style="position: absolute; left: 16px; right: 16px; bottom: 22px; height: 1px; background: var(--border-subtle)" aria-hidden="true"></span>
      <button class="k-btn k-btn--ghost k-btn--sm" style="position: absolute; right: 8px; bottom: 6px">Löschen</button>
    </div>
    <label class="k-check" style="margin-top: 16px"><input type="checkbox" checked>Ich stimme zu, dieses Dokument elektronisch zu unterschreiben (einfache elektronische Signatur nach eIDAS). Der Vorgang wird protokolliert.</label>
    <div class="k-dialog-actions">
      <button class="k-btn k-btn--secondary">Abbrechen</button>
      <button class="k-btn k-btn--primary"><svg class="k-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>Signatur einfügen</button>
    </div>
  </div>
</div>
</body></html>
