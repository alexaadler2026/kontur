# CI: format, lint, unit tests, build, Storybook build and e2e (incl. axe).
# - pull request: only projects affected by the PR (compared with main)
# - push to main / manual run: ALL projects — main is always fully verified, so a
#   docs-only commit can never produce a green run that checked nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

env:
  NX_RUN: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: "affected" compares the PR with main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - name: Set up Node.js (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD so "affected" knows which commits to compare (PRs only).
      - name: Find base commit for affected
        uses: nrwl/nx-set-shas@v5
        if: github.event_name == 'pull_request'

      - name: Format check
        run: pnpm nx format:check --all

      # Always, not "affected": tokens.json lives outside Nx projects. Cheap (cached).
      - name: Design tokens up to date
        run: pnpm nx run tokens:check

      # The step name shows the real mode: "run-many" on main, "affected" in PRs.
      - name: Lint, test, typecheck, build, Storybook (nx ${{ env.NX_RUN }})
        run: pnpm nx $NX_RUN -t lint test typecheck build build-storybook

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke + axe (nx ${{ env.NX_RUN }})
        run: pnpm nx $NX_RUN -t e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
