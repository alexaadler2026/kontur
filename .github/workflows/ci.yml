# CI: format, lint, unit tests, build, Storybook build, integration tests on PostgreSQL
#     and e2e (incl. axe).
# CD: on main, the Storybook build that passed e2e/axe is published to GitHub Pages
#     (build once, deploy the tested artifact — ADR-0005).
# - pull request: only projects affected by the PR (compared with main)
# - push to main / manual run: ALL projects — main is always fully verified, so a
#   docs-only commit can never produce a green run that checked nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

env:
  NX_RUN: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}

permissions:
  contents: read

# Pull requests: a newer push cancels the run that is still going.
# main: runs queue instead, so a new push can never abort a deployment half-way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: "affected" compares the PR with main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - name: Set up Node.js (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD so "affected" knows which commits to compare (PRs only).
      - name: Find base commit for affected
        uses: nrwl/nx-set-shas@v5
        if: github.event_name == 'pull_request'

      - name: Format check
        run: pnpm nx format:check --all

      # Always, not "affected": tokens.json lives outside Nx projects. Cheap (cached).
      - name: Design tokens up to date
        run: pnpm nx run tokens:check

      # Always: AGENTS.md is outside Nx projects. A map, not an encyclopedia (≤ 150 lines).
      - name: AGENTS.md stays short
        run: pnpm check:agents-md

      - name: Angular builders share one version
        run: pnpm check:angular-builders

      # A project without a scope/type/platform tag falls under no boundary rule.
      - name: Every project has scope, type and platform tags
        run: pnpm check:project-tags

      # The platform rule itself: a frontend importing @adlersoft/api-kit is a lint error.
      - name: The browser never imports server code
        run: pnpm check:module-boundaries

      # The step name shows the real mode: "run-many" on main, "affected" in PRs.
      # api-check: the committed openapi.json must match the API's DTOs (ADR-0007).
      - name: Lint, test, typecheck, build, Storybook, api-check (nx ${{ env.NX_RUN }})
        run: pnpm nx $NX_RUN -t lint test typecheck build build-storybook api-check

      # Testcontainers starts PostgreSQL in the runner's Docker (ADR-0014): all migrations
      # applied to an empty database, schema.prisma = migrations, the tests on real data.
      - name: Integration tests on PostgreSQL (nx ${{ env.NX_RUN }})
        run: pnpm nx $NX_RUN -t test-integration

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke + axe (nx ${{ env.NX_RUN }})
        run: pnpm nx $NX_RUN -t e2e

      # Build once, deploy the tested artifact (ADR-0005): the folder the e2e/axe step just
      # tested (build-storybook from the Nx cache) is handed to the deploy job unchanged.
      # Same condition as the deploy job: pull requests never produce a Pages artifact.
      - name: Upload tested Storybook for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/storybook/ui-storybook
          retention-days: 14 # fast rollback: re-run an older deploy while its artifact exists

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7

  # CD: publish the tested Storybook. Runs only after a green "main" job, only on main,
  # never for pull requests (incl. forks). The only job with write rights.
  deploy-storybook:
    needs: main
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # OIDC: short-lived token for Pages instead of a stored secret
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
