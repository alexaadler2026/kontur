# CI: format, lint, unit tests, build, Storybook build and e2e (incl. axe).
# - pull request: only projects affected by the PR (compared with main)
# - push to main / manual run: ALL projects — main is always fully verified, so a
#   docs-only commit can never produce a green run that checked nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

env:
  NX_RUN: ${{ github.event_name == 'pull_request' && 'affected' || 'run-many' }}

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: "affected" compares the PR with main

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets NX_BASE / NX_HEAD so "affected" knows which commits to compare (PRs only).
      - uses: nrwl/nx-set-shas@v5
        if: github.event_name == 'pull_request'

      - run: pnpm nx format:check --all
      - run: pnpm nx $NX_RUN -t lint test build build-storybook

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx $NX_RUN -t e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
