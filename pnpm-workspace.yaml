# Workspace packages: server libraries that the APIs import by package name, linked by pnpm
# into node_modules (buildable libraries, ADR-0007). Everything else uses tsconfig paths.
packages:
  - 'libs/shared/*'

allowBuilds:
  '@swc/core': true
  nx: true
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  '@parcel/watcher': false
  unrs-resolver: false
  '@scarf/scarf': false
  # Prisma: no install scripts. The CLI fetches its schema engine itself on first use
  # (journal 031); the client needs no binary (query compiler + driver adapter).
  '@prisma/engines': false
  prisma: false
  # Testcontainers: ssh2/cpu-features are optional native SSH speed-ups (Docker is reached
  # through its socket/pipe); protobufjs only prints a version notice.
  cpu-features: false
  protobufjs: false
  ssh2: false
